spring.application.name=api

server.port=8080

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/api_db?useSSL=false&serverTimezone=Asia/Jakarta
spring.datasource.username=root
spring.datasource.password=

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JACKSON
# ===============================
spring.jackson.time-zone=Asia/Jakarta

# ===============================
# JWT
# ===============================
app.jwt.secret=change-this-secret-key-to-a-very-long-secret-key
app.jwt.expiration=86400000

# ===============================
# REFRESH TOKEN
# ===============================
# Access token (app.jwt.expiration) = 1 hari (24 jam)
# Refresh token di bawah ini = 7 hari, dipakai untuk minta access token baru
# tanpa perlu login ulang pakai email+password lagi
app.jwt.refresh-expiration=604800000

# ===============================
# EMAIL (SMTP) - untuk fitur lupa password
# ===============================
# Contoh pakai Gmail: aktifkan 2FA di akun Gmail, lalu buat "App Password"
# di myaccount.google.com/apppasswords, isi ke spring.mail.password (BUKAN
# password Gmail biasa). Untuk testing lokal tanpa kirim email beneran,
# bisa pakai Mailtrap.io (gratis, aman buat development).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ganti-dengan-email-kamu@gmail.com
spring.mail.password=ganti-dengan-app-password-16-digit
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Token reset password berlaku 15 menit (dalam milidetik)
app.reset-password.token-expiration=900000

# URL frontend yang menampilkan form "masukkan password baru".
# Backend cuma kirim link ini di email, halaman reset-nya sendiri
# nanti dibuat di sisi frontend (React/Vue/dll), bukan di sini.
app.reset-password.frontend-url=http://localhost:5173/reset-password